<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="ESTILOS/style.css">
    <link rel="stylesheet" href="ESTILOS/media-query.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>
                    Seja Bem-Vindo(a) Novamente. Faça o login para acessar sua conta novamente
                </p>
                <form action="" method="post" autocomplete="on">
                    <div class="campo">
                        <i class="material-icons">person</i>
                        <input type="email" name="login" id="ilogin" placeholder="Digite seu e-mail" 
                        autocomplete="email" required maxlength="20">
                        <label for="ilogin"> Login</label>
                    </div>
                    <div class="campo">
                        <i class="material-icons">vpn_key</i>
                        <input type="password" name="senha" id="isen" placeholder="Digite sua Senha"
                         autocomplete="current-password" required minlength="4" maxlength="8">
                        <label for="isen"> Senha</label>
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="esqueci.html" target="_blank" class="botao">
                        Esqueci a senha <i class="material-icons">mail</i>
                    </a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
